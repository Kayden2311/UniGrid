<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="740" viewBox="0 0 1280 740" role="img" aria-label="UniGrid workspace: Kanban board, contribution chart and AI assistant">
  <defs>
    <linearGradient id="side" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#0b2a6f"/>
      <stop offset="1" stop-color="#06163f"/>
    </linearGradient>
    <linearGradient id="ai" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#8b5cf6"/>
      <stop offset="1" stop-color="#0ea5e9"/>
    </linearGradient>
    <linearGradient id="stage" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#dbeafe"/>
      <stop offset="1" stop-color="#ede9fe"/>
    </linearGradient>
    <filter id="sh" x="-10%" y="-10%" width="120%" height="130%">
      <feDropShadow dx="0" dy="18" stdDeviation="20" flood-color="#0b2a6f" flood-opacity="0.22"/>
    </filter>
    <filter id="sh2" x="-10%" y="-10%" width="120%" height="140%">
      <feDropShadow dx="0" dy="2" stdDeviation="2" flood-color="#0f172a" flood-opacity="0.08"/>
    </filter>
    <style>
      .t { font-family: 'Segoe UI', -apple-system, 'Helvetica Neue', Arial, sans-serif; }
      .drag { animation: drag 5s ease-in-out infinite; }
      .typing circle { animation: blink 1.2s infinite; }
      .typing circle:nth-child(2) { animation-delay: .2s; }
      .typing circle:nth-child(3) { animation-delay: .4s; }
      @keyframes drag { 0%,20% { transform: translate(0,0); } 45%,70% { transform: translate(232px,-6px) rotate(2deg); } 95%,100% { transform: translate(0,0); } }
      @keyframes blink { 0%,100% { opacity: .25; } 50% { opacity: 1; } }
    </style>
  </defs>

  <rect width="1280" height="740" rx="24" fill="url(#stage)"/>

  <g filter="url(#sh)">
    <rect x="40" y="36" width="1200" height="668" rx="18" fill="#ffffff"/>
  </g>

  <!-- window chrome -->
  <circle cx="66" cy="60" r="6" fill="#f87171"/><circle cx="86" cy="60" r="6" fill="#fbbf24"/><circle cx="106" cy="60" r="6" fill="#34d399"/>
  <rect x="440" y="50" width="400" height="22" rx="11" fill="#f1f5f9"/>
  <text x="640" y="65" text-anchor="middle" class="t" font-size="11" fill="#64748b">unigrid.onrender.com/WorkspaceDetail</text>

