    <text x="84" y="172">Dashboard</text>
    <rect x="56" y="190" width="168" height="34" rx="8" fill="#1e88e5"/>
    <text x="84" y="212" fill="#ffffff" font-weight="600">Workspaces</text>
    <text x="84" y="252">Schedule</text>
    <text x="84" y="292">Federations</text>
    <text x="84" y="332">Pricing</text>
